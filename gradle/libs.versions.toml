## Kobe Reader version catalog.
##
## The AGP / Gradle-wrapper / Kotlin / KSP quadruple must stay compatible:
##   agp 9.3.x  ->  Gradle wrapper >= 9.5.0, JDK 17+, compileSdk 37
##   kotlin 2.3.21 -> ksp 2.3.10 (first KSP release that fixes R-class
##                    resolution under AGP 9 built-in Kotlin)
## After changing any of these four, run `./gradlew help` before anything else.

[versions]
# --- Toolchain -------------------------------------------------------------
agp = "9.3.1"
kotlin = "2.3.21"
ksp = "2.3.10"
compileSdk = "37"
minSdk = "24"
targetSdk = "37"

# --- AndroidX --------------------------------------------------------------
activityCompose = "1.13.0"
androidxCore = "1.19.0"
androidxHilt = "1.4.0"
composeBom = "2026.06.01"
datastore = "1.2.0"
# java.time on API 24/25 (see coreLibraryDesugaring in app/build.gradle.kts).
desugarJdk = "2.1.5"
documentfile = "1.1.0"
lifecycle = "2.11.0"
material3 = "1.4.0"
# Navigation Compose (Nav 2) with type-safe @Serializable routes.
navigationCompose = "2.9.0"
room3 = "3.0.0"
splashscreen = "1.2.0"
sqlite = "2.7.0"
work = "2.11.2"

# --- Kotlin ecosystem ------------------------------------------------------
coroutines = "1.11.0"
kotlinxImmutable = "0.5.1"
kotlinxSerialization = "1.11.0"

# --- Third party -----------------------------------------------------------
coil = "3.5.0"
hilt = "2.60.1"
# PdfBox-Android is the structural PDF engine (merge/split/encrypt/...).
# Page *rendering* uses the platform android.graphics.pdf.PdfRenderer instead.
pdfbox = "2.0.27.0"

# Play services. These two are the only pins Android Studio is likely to flag
# as out of date on first sync - bump them there if resolution fails; nothing
# outside com.kobe.reader.monetization depends on them.
playBilling = "8.0.0"
playServicesAds = "24.6.0"

# --- Test ------------------------------------------------------------------
androidxJunit = "1.3.0"
androidxTestRunner = "1.7.0"
espresso = "3.7.0"
junit = "4.13.2"
robolectric = "4.16.1"
truth = "1.4.5"
turbine = "1.2.1"

[libraries]
# --- AndroidX / Compose ----------------------------------------------------
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# androidx.core 1.19.0 merged the core-ktx extensions back into androidx.core.
androidx-core = { group = "androidx.core", name = "core", version.ref = "androidxCore" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
android-desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdk" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-work-testing = { group = "androidx.work", name = "work-testing", version.ref = "work" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

# --- Persistence -----------------------------------------------------------
room3-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room3" }
room3-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room3" }
room3-testing = { group = "androidx.room3", name = "room3-testing", version.ref = "room3" }
# sqlite-framework keeps the APK small by using the platform SQLite. Swap for
# androidx.sqlite:sqlite-bundled (+ BundledSQLiteDriver) if a consistent SQLite
# version across OEMs ever matters more than ~3 MB of native libraries.
androidx-sqlite-framework = { group = "androidx.sqlite", name = "sqlite-framework", version.ref = "sqlite" }

# --- DI --------------------------------------------------------------------
# hiltViewModel() lives in hilt-lifecycle-viewmodel-compose since androidx.hilt
# 1.3.0; it resolves against any ViewModelStoreOwner, NavBackStackEntry included.
androidx-hilt-compiler = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "androidxHilt" }
androidx-hilt-lifecycle-viewmodel-compose = { group = "androidx.hilt", name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-hilt-work = { group = "androidx.hilt", name = "hilt-work", version.ref = "androidxHilt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }

# --- Kotlin ----------------------------------------------------------------
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlinxImmutable" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# --- Third party -----------------------------------------------------------
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfbox" }
play-billing = { group = "com.android.billingclient", name = "billing-ktx", version.ref = "playBilling" }
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }

# --- Test ------------------------------------------------------------------
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }

[bundles]
compose = [
    "compose-foundation",
    "compose-material3",
    "compose-ui",
    "compose-ui-graphics",
    "compose-ui-tooling-preview",
]
unit-test = [
    "junit",
    "kotlin-test-junit",
    "kotlinx-coroutines-test",
    "truth",
    "turbine",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
androidx-room3 = { id = "androidx.room3", version.ref = "room3" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
